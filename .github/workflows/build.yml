name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Installing the latest gdown from GitHub to bypass Google Drive blocks..."
          pip install git+https://github.com/wkentaro/gdown.git
          
          echo "Downloading prod.keys..."
          gdown "https://drive.google.com/uc?id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -O prod.keys
          
          echo "Downloading game.nsp (Absolum)..."
          gdown "https://drive.google.com/uc?id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -O game.nsp

          # 다운로드된 파일의 실제 용량 확인
          ls -lh prod.keys game.nsp

      - name: Clone and Setup nxnative
        run: |
          git clone https://github.com/nxnative/nxnative.git

      - name: Build nxnative App
        run: |
          cd nxnative
          # Mac 환경에서 Xcode를 사용하여 nxnative 앱 껍데기 컴파일
          xcodebuild -project nxnative.xcodeproj -scheme nxnative -configuration Release -arch arm64 CONFIGURATION_BUILD_DIR=../build

      - name: Inject ROM and Package IPA
        run: |
          # IPA 패키징의 필수 규격인 Payload 폴더 생성
          mkdir -p Payload
          
          # 방금 빌드된 앱 껍데기를 Payload 폴더로 이동
          cp -r build/nxnative.app Payload/
          
          # 다운로드한 게임 롬과 키 파일을 앱 껍데기 내부로 밀어넣기
          cp game.nsp Payload/nxnative.app/Absolum.nsp
          cp prod.keys Payload/nxnative.app/
          
          # 롬이 포함된 최종 Payload 폴더를 .ipa 파일로 압축
          zip -qr9 Absolum-Final.ipa Payload/

      - name: Upload Complete IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolum-IPA
          path: Absolum-Final.ipa
          # 1.8GB 용량의 이중 압축(zip 안의 zip) 방지를 위해 압축률 0 설정
          compression-level: 0
