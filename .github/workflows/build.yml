name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Downloading files from Google Drive..."
          
          # prod.keys 다운로드
          curl -sc /tmp/cookie "https://drive.google.com/uc?export=download&id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" > /tmp/confirm.html
          CODE="$(awk '/_="/{print $2}' /tmp/confirm.html | tr -d '\"' || true)"
          curl -Lb /tmp/cookie "https://drive.google.com/uc?export=download&confirm=${CODE}&id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -o prod.keys
          
          # game.nsp 대용량 파일 다운로드 (확인 페이지 우회)
          URL="https://drive.google.com/uc?export=download&id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE"
          CONFIRM=$(wget --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate -qO- "${URL}" | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p')
          wget --load-cookies /tmp/cookies.txt --no-check-certificate -O game.nsp "${URL}&confirm=${CONFIRM}"

          # 파일 크기 및 정상 다운로드 여부 확인용 출력
          ls -lh prod.keys game.nsp

      - name: Clone and Setup nxnative
        run: |
          git clone https://github.com/nxnative/nxnative.git

      - name: Build IPA with nxnative
        run: |
          mkdir -p nxnative/output
          mv game.nsp nxnative/output/Absolum.nsp
          mv prod.keys nxnative/output/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: nxnative/output/*
