name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install System Dependencies
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Packages
        run: |
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"
          pip install git+https://github.com/wkentaro/gdown.git

      - name: Clone Official nxnative Repository
        run: |
          git clone https://github.com/seedds/nxnative.git

      - name: Download ROM and Keys
        run: |
          mkdir -p game_folder
          
          echo "Downloading prod.keys..."
          gdown "https://drive.google.com/uc?id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -O prod.keys
          
          echo "Downloading game.nsp (Absolum)..."
          gdown "https://drive.google.com/uc?id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -O game_folder/game.nsp

      - name: Build IPA using nxnative script
        run: |
          cd nxnative
          # 공식 파이썬 스크립트를 통해 롬 파일을 네이티브 iOS 앱으로 재컴파일
          python3 scripts/build_ipa_from_nsp.py ../game_folder -k ../prod.keys

      - name: Upload Complete IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolum-IPA
          # 빌드가 성공하면 원본 게임 폴더 내부에 .ipa 파일이 생성됨
          path: game_folder/*.ipa
          compression-level: 0
