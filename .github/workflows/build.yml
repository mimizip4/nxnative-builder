name: Build nxnative IPA

on:
  workflow_dispatch: # 수동으로 워크플로우를 실행하도록 설정

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 구글 드라이브에서 롬 파일(ZIP) 다운로드
      # 주의: 이 부분은 이전에 에러를 해결하셨던 본인의 실제 다운로드 명령어로 수정하셔야 합니다.
      - name: Download ROM Zip from Google Drive
        run: |
          # 예시: gdown 등을 이용해 파일을 다운로드 (본인의 코드로 덮어씌우세요)
          # gdown "https://drive.google.com/uc?id=본인의_구글드라이브_파일ID" -O rom_download.zip
          
          # 파일 이름을 통일하기 위해 임시로 rom_download.zip으로 이름을 바꿉니다.
          mv 원래다운받은파일이름.zip rom_download.zip

      # 3. 다운로드한 롬 파일 압축 해제
      - name: Unzip ROM Files
        run: |
          # 압축을 풀어 rom_files 폴더에 nsp와 keys 파일을 모아둡니다.
          unzip -q rom_download.zip -d rom_files/

      # 4. nxnative 베이스 IPA (껍데기) 다운로드
      - name: Download nxnative Base IPA
        run: |
          wget -O base.ipa "https://github.com/nxnative/nxnative/releases/latest/download/nxnative.ipa"

      # 5. 롬/키 파일 삽입 및 IPA 재패키징
      - name: Inject ROM and Repackage IPA
        run: |
          # 베이스 IPA 압축 해제 (Payload 폴더가 생성됨)
          unzip -q base.ipa -d ipa_workspace
          
          # rom_files 폴더 안의 nsp 게임 파일과 keys 파일을 nxnative 앱 내부로 복사
          cp rom_files/*.nsp ipa_workspace/Payload/nxnative.app/
          cp rom_files/*.keys ipa_workspace/Payload/nxnative.app/
          
          # 완성된 Payload 폴더를 다시 .ipa 형식으로 묶기
          cd ipa_workspace
          zip -qr9 ../Absolum-Final.ipa Payload/

      # 6. 최종 완성된 단일 IPA 파일을 Artifact로 업로드
      - name: Upload Complete IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolum-IPA
          path: Absolum-Final.ipa
          # 1.8GB 대용량의 이중 압축 방지를 위해 압축률을 0으로 설정합니다.
          compression-level: 0
