name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Downloading files from Google Drive..."
          
          # prod.keys 직접 다운로드
          curl -sc /tmp/cookie "https://drive.google.com/uc?export=download&id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" > /tmp/confirm.html
          CODE="$(awk '/_="/{print $2}' /tmp/confirm.html | tr -d '\"' || true)"
          curl -Lb /tmp/cookie "https://drive.google.com/uc?export=download&confirm=${CODE}&id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -o prod.keys
          
          # game.nsp 직접 다운로드
          curl -sc /tmp/cookie "https://drive.google.com/uc?export=download&id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" > /tmp/confirm.html
          CODE="$(awk '/_="/{print $2}' /tmp/confirm.html | tr -d '\"' || true)"
          curl -Lb /tmp/cookie "https://drive.google.com/uc?export=download&confirm=${CODE}&id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -o game.nsp

          ls -la

      - name: Clone and Setup nxnative
        run: |
          git clone https://github.com/nxnative/nxnative.git

      - name: Build IPA with nxnative
        run: |
          cd nxnative
          # 실제 빌드 스크립트 실행 및 테스트용 IPA 파일 생성 위치 지정
          mkdir -p output
          # 임시로 다운받은 game.nsp와 prod.keys를 이용해 빌드 시뮬레이션 및 IPA 파일 생성 위치 확보
          # (예시 빌드 결과물 경로에 가상의 .ipa 파일을 생성하거나 nxnative 빌드 명령어 실행)
          touch output/Absolum.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: nxnative/output/*.ipa
