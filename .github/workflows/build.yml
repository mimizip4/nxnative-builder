name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Downloading files from Google Drive..."
          pip install gdown
          
          # prod.keys 다운로드
          gdown --id "1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -O prod.keys
          
          # Absolum ROM (.nsp) 다운로드
          gdown --id "1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -O game.nsp

          ls -la

      - name: Clone and Setup nxnative
        run: |
          git clone https://github.com/nxnative/nxnative.git

      - name: Build IPA with nxnative
        run: |
          cd nxnative
          # (추후 nxnative 빌드 스크립트 실행 명령어 추가)
