name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Installing gdown for large file download..."
          pip install gdown
          
          echo "Downloading prod.keys..."
          gdown --fuzzy --id "1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -O prod.keys
          
          echo "Downloading game.nsp (Absolum)..."
          gdown --fuzzy --id "1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -O game.nsp

          # 다운로드된 파일 크기 확인용 출력
          ls -lh prod.keys game.nsp

      - name: Clone and Setup nxnative
        run: |
          git clone https://github.com/nxnative/nxnative.git

      - name: Build IPA with nxnative
        run: |
          mkdir -p nxnative/output
          # 롬 파일과 키를 결과물 폴더에 포함시켜 아티팩트로 업로드
          mv game.nsp nxnative/output/game.nsp
          mv prod.keys nxnative/output/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: nxnative/output/*
