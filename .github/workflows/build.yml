name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Installing the latest gdown from GitHub to bypass Google Drive blocks..."
          pip install git+https://github.com/wkentaro/gdown.git
          
          echo "Downloading prod.keys..."
          gdown "https://drive.google.com/uc?id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -O prod.keys
          
          echo "Downloading game.nsp (Absolum)..."
          gdown "https://drive.google.com/uc?id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -O game.nsp

          # 다운로드된 파일의 실제 용량 확인
          ls -lh prod.keys game.nsp

      - name: Download Pre-built nxnative App
        run: |
          echo "Downloading official nxnative base IPA..."
          # 공식 컴파일이 완료된 껍데기(base.ipa) 다운로드
          wget -O base.ipa "https://github.com/nxnative/nxnative/releases/latest/download/nxnative.ipa"

      - name: Inject ROM and Package IPA
        run: |
          # 1. 껍데기 압축 해제 (내부 규격인 Payload 폴더가 나옴)
          unzip -q base.ipa -d ipa_workspace
          
          # 2. 구글 드라이브에서 받은 롬과 키를 껍데기 안으로 밀어넣기
          cp game.nsp ipa_workspace/Payload/nxnative.app/Absolum.nsp
          cp prod.keys ipa_workspace/Payload/nxnative.app/
          
          # 3. 롬이 포함된 Payload 폴더를 진짜 .ipa로 최종 압축
          cd ipa_workspace
          zip -qr9 ../Absolum-Final.ipa Payload/

      - name: Upload Complete IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolum-IPA
          path: Absolum-Final.ipa
          # 1.8GB 용량의 이중 압축 방지를 위해 압축률 0 설정
          compression-level: 0
