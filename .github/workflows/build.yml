name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Installing gdown..."
          pip install git+https://github.com/wkentaro/gdown.git
          
          echo "Downloading prod.keys..."
          gdown "https://drive.google.com/uc?id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up" -O prod.keys
          
          echo "Downloading game.nsp (Absolum)..."
          gdown "https://drive.google.com/uc?id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE" -O game.nsp

      - name: Download Pre-built nxnative App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching the latest release IPA using GitHub CLI..."
          # 버전 이름에 상관없이 최신 릴리즈에 첨부된 .ipa 파일을 자동으로 찾아 다운로드합니다.
          gh release download -R nxnative/nxnative --pattern "*.ipa"
          
          # 다운받은 파일의 이름을 일괄적으로 base.ipa로 변경합니다.
          mv *.ipa base.ipa

      - name: Inject ROM and Package IPA
        run: |
          # 1. 껍데기 압축 해제
          unzip -q base.ipa -d ipa_workspace
          
          # 2. 내부 앱 폴더(*.app)를 자동 추적하여 롬과 키 파일 주입
          cp game.nsp ipa_workspace/Payload/*.app/Absolum.nsp
          cp prod.keys ipa_workspace/Payload/*.app/
          
          # 3. 롬이 포함된 폴더를 다시 .ipa로 압축
          cd ipa_workspace
          zip -qr9 ../Absolum-Final.ipa Payload/

      - name: Upload Complete IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolum-IPA
          path: Absolum-Final.ipa
          compression-level: 0
