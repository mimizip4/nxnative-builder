name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ROM and Keys from Google Drive
        run: |
          echo "Downloading files from Google Drive with confirmation bypass..."
          
          # prod.keys 다운로드
          KEY_URL="https://drive.google.com/uc?export=download&id=1I1UnUhans5WryoLtTmgaZxj_ZmG-o0up"
          KEY_CONFIRM=$(wget --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate -qO- "${KEY_URL}" | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p')
          wget --load-cookies /tmp/cookies.txt --no-check-certificate -O prod.keys "${KEY_URL}&confirm=${KEY_CONFIRM}"
          
          # game.nsp 대용량 파일 다운로드
          ROM_URL="https://drive.google.com/uc?export=download&id=1qYyHFLRlczEAJIJY-LqMzwAIkOtYdVdE"
          ROM_CONFIRM=$(wget --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate -qO- "${ROM_URL}" | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p')
          wget --load-cookies /tmp/cookies.txt --no-check-certificate -O game.nsp "${ROM_URL}&confirm=${ROM_CONFIRM}"

          # 파일 크기 확인 (정상적으로 수 GB가 찍혀야 합니다)
          ls -lh prod.keys game.nsp

      - name: Clone and Setup nxnative
        run: |
          git clone https://github.com/nxnative/nxnative.git

      - name: Build IPA with nxnative
        run: |
          mkdir -p nxnative/output
          mv game.nsp nxnative/output/Absolum.nsp
          mv prod.keys nxnative/output/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: nxnative/output/*
