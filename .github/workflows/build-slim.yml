# NxNative - Slim IPA Builder (--romfs separate)
#
# 슬림 빌드 전용 파일. 기존 build.yml은 건드리지 않는다.
# GitHub에 저장할 경로: .github/workflows/build-slim.yml
# (build.yml과 별개 파일로 두면, Actions 탭에서 두 워크플로우를 따로 실행할 수 있다.
#  슬림 빌드가 실패하면 그냥 기존 build.yml을 다시 실행하면 된다. 되돌리기 불필요.)
# 빈 레포(Private 권장)에 이 파일만 넣는다. 게임 파일이나 keys를 레포에 올리지 않는다.
# nxnative 소스를 fork할 필요도 없다. 아래에서 device 선택에 따라 원본/폴백 소스를 checkout한다.
#
# Secrets (이름은 대소문자·언더스코어까지 정확히):
#   Game_URL   - 베이스 게임 파일의 Google Drive 공유 링크 전체 (파일 내용이 아니라 링크)
#   Keys_URL   - prod.keys 파일의 Google Drive 공유 링크 전체
#   Update_URL - (선택) 게임 업데이트 파일의 공유 링크, 있을 때만 만든다
#   Update2_URL - (선택) 두 번째 업데이트 파일의 공유 링크. Absolum처럼 업데이트가
#     2개(v131072, v327680)인 경우 여기에 두 번째 링크를 넣는다. 없으면 비워둔다.
#   DLC_URL    - (선택) DLC 파일의 공유 링크, 있을 때만 만든다
#   중요: 다운로드한 파일은 원래 Drive 파일명으로 그대로 둔다. 원래 이름에 들어 있는
#   [0100A83022A22000][v0], [0100A83022A22800][v327680] 같은 타이틀 ID·버전 태그가
#   스크립트가 업데이트를 인식하는 기준이다. 이전 버전이 game.nsp / update.nsp /
#   dlc.nsp로 이름을 바꿔서 태그를 지웠고, 그 때문에 스크립트가 업데이트 2개를
#   모두 제외하고 베이스 v0만으로 빌드했다. (2026-11-05 확인, Drive 원본 파일명은
#   태그가 온전함) 이 버전부터는 이름을 바꾸지 않는다.
# Drive 공유 설정은 각 파일마다 "링크가 있는 모든 사용자 - 뷰어"로 한다.
# 빌드가 끝나면 Drive 공유를 다시 "제한됨"으로 돌리는 것을 가이드가 권한다.
# Run workflow에서 device는 iPhone 18 Pro면 "iPhone 15 Pro/Pro Max or newer (standard)"를 고른다.
# profile_id는 비워두면 자동 감지다. 특정 프로필로 강제할 때만 16자리 16진수를 넣는다.

name: NxNative - Slim IPA Builder (--romfs separate)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        # 가이드 원본의 기본값은 BC fallback이지만, 이 사용자는 iPhone 18 Pro라 standard를 기본값으로 바꿨다.
        default: "iPhone 15 Pro/Pro Max or newer (standard)"
        options:
          - "iPhone 15 Pro/Pro Max or newer (standard)"
          - "iPhone 15 or older (BC fallback)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # 2026-11-05 두 번째 실패 원인 수정: macos-latest(=macOS 26, 기본 Xcode 26.6)는
    # dmsh_chain.lock이 테스트한 Metal 컴파일러(32023.922, Xcode 27.2)와 달라서
    # Build unsigned IPA 단계에서 멈춘다. xcode-27 러너에는 Xcode 27.2가
    # /Applications/Xcode_27.2.app 심링크로 들어 있으니 그 러너를 쓴다.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Select Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          # 에러 메시지가 직접 권하는 순서: Xcode 27.2 선택 → Metal toolchain 다운로드.
          # xcode-27 러너에 27.2 심링크가 없으면 여기서 멈춘다. 그때는 --allow-other-metal
          # 우회(셰이더 손상 보고 있음, issue #242)를 쓸지, 아니면 러너 이미지를 확인할지 정한다.
          ls -ld /Applications/Xcode_27.2.app
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27.2" || { echo "Xcode 27.2가 선택되지 않았습니다."; exit 1; }
          xcodebuild -downloadComponent MetalToolchain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          # 위에서 Xcode 27.2를 이미 선택했으므로 여기서는 확인만 한다.
          xcodebuild -version
          # 가이드 범용본: xcodegen zstd spirv-cross unar
          # 공식 README본: glslang, nsz, zbic도 함께 넣어 두 경로 모두에서 빠지는 게 없게 한다.
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools nsz zbic backports.zstd gdown

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          UPDATE2_URL: ${{ secrets.Update2_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local label="$2"
            local file_id
            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi
            # 공유 링크 전체, ?id= 형태, 또는 ID만 모두 받아서 ID를 뽑는다.
            file_id="$(python - "$url" <<'PY'
          import re, sys
          from urllib.parse import urlparse, parse_qs
          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None
          match = re.search(r"/file/d/([^/]+)", parsed.path)
          if match:
              file_id = match.group(1)
          elif query.get("id"):
              file_id = query["id"][0]
          elif re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url
          if not file_id:
              raise SystemExit("Could not extract a Google Drive file ID.")
          print(file_id)
          PY
            )"
            # 원래 Drive 파일명을 그대로 쓴다. -O로 이름을 바꾸면 [타이틀][vN]
            # 태그가 사라져 스크립트가 업데이트를 제외한다. 그래서 label별 폴더에
            # gdown 기본 파일명으로 받고, 받은 파일이 딱 1개인지 확인한다.
            local dest_dir="$WORK/$label"
            mkdir -p "$dest_dir"
            echo "Downloading $label (file ID kept, original filename preserved)..."
            (cd "$dest_dir" && gdown --continue "$file_id")
            local count
            count="$(find "$dest_dir" -type f | wc -l)"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::$label download produced $count files, expected 1."
              exit 1
            fi
            local downloaded
            downloaded="$(find "$dest_dir" -type f -print -quit)"
            if [[ ! -s "$downloaded" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi
            echo "Downloaded $label as: $(basename "$downloaded")"
            file "$downloaded"
            # Drive 경고 HTML이 저장됐으면 여기서 멈춘다. 나중에 NSP 서명 검사에서
            # 이상한 에러로 터지는 것보다 원인이 바로 보인다.
            if head -c 200 "$downloaded" | grep -qia "<html"; then
              echo "::error::Downloaded file looks like a Drive warning page, not the real file. Check sharing (Anyone with the link - Viewer) and the link."
              exit 1
            fi
          }

          download_file "$GAME_URL" "game"
          download_file "$KEYS_URL" "keys"
          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "update"
          else
            echo "No Update_URL configured; continuing without an update."
          fi
          if [[ -n "${UPDATE2_URL:-}" ]]; then
            download_file "$UPDATE2_URL" "update2"
          else
            echo "No Update2_URL configured; continuing without a second update."
          fi
          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "dlc"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi
          # prod.keys는 keys 폴더 안에 원래 이름으로 받아졌으므로, 빌드 단계가
          # 쓰는 경로로 옮기고 권한을 제한한다.
          KEYS_FILE="$(find "$WORK/keys" -type f -print -quit)"
          cp "$KEYS_FILE" "$WORK/prod.keys"
          chmod 600 "$WORK/prod.keys"

      - name: Prepare game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"
          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil, sys
          from pathlib import Path
          work, game_dir = Path(sys.argv[1]), Path(sys.argv[2])
          # label별 폴더에서 받은 파일을 원래 파일명 그대로 GameFiles로 복사한다.
          # 이름을 바꾸지 않는 것이 핵심이다. 원래 이름에 [타이틀 ID][vN] 태그가
          # 들어 있어야 스크립트가 베이스/업데이트/DLC를 구분한다.
          for label in ("game", "update", "update2", "dlc"):
              folder = work / label
              if not folder.exists():
                  continue
              for source in sorted(p for p in folder.iterdir() if p.is_file()):
                  magic = source.open("rb").read(4)
                  if magic not in (b"PFS0", b"HEAD"):
                      raise SystemExit(
                          f"{label} ({source.name}) is not a direct NSP/XCI file. "
                          "If it is a RAR archive, use the guide's original universal YAML "
                          "from Pastebin, which handles RAR extraction."
                      )
                  target = game_dir / source.name
                  shutil.copy2(source, target)
                  print(f"Added {label}: {target.name} ({target.stat().st_size:,} bytes)")
          packages = sorted(p for p in game_dir.iterdir() if p.is_file())
          if not packages:
              raise SystemExit("No game packages were prepared.")
          print("=== Prepared game packages ===")
          for p in packages:
              print(f"{p.name}: {p.stat().st_size:,} bytes")
          PY

      - name: Select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          # profile_id를 비워두면 자동 감지라서 이 단계는 검증만 한다.
          # 값을 넣었으면 16자리 16진수인지 확인하고 DM_GAME으로 넘긴다.
          if [[ -n "${PROFILE_OVERRIDE:-}" ]]; then
            PROFILE_ID="$(echo "$PROFILE_OVERRIDE" | tr '[:lower:]' '[:upper:]')"
            if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
              echo "::error::Profile ID must be exactly 16 hexadecimal characters."
              exit 1
            fi
            echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
            echo "Shader profile override: $PROFILE_ID"
          else
            echo "No profile override; using automatic detection."
          fi

      - name: Update shader toolchain header
        shell: bash
        run: |
          set -euo pipefail
          # 2026-11-05 첫 실행 실패 원인 수정: 현재 seedds main의 dmsh_chain.py는
          # 인자 없음 / --header / --inputs만 받는다. 가이드 원본의 --update-lock은
          # 이 스크립트의 유효한 옵션이 아니어서 "usage: see the file header"로
          # 즉시 실패한다. lock 검증·재작성은 tool_lock.py의 역할이다.
          # 따라서 --update-lock을 빼고 --header만 실행한다.
          CHAIN_SCRIPT="$(find . -name dmsh_chain.py -type f -print -quit)"
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi
          echo "Found: $CHAIN_SCRIPT"
          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"
          # checkout으로 가져온 소스가 작업 루트라서 cd nxnative를 하지 않는다.
          # 슬림 빌드: --romfs separate 로 게임 데이터(RomFS)를 IPA에서 뺀다.
          # 공식 README: "Game too big to install? Build again with --romfs separate"
          # 추출은 하나의 RomFS.img 파일로 이뤄진다. 이 파일은 IPA에 안 들어가고
          # 아래 "Prepare RomFS artifact" 단계에서 따로 아티팩트로 올린다.
          # GitHub 러너에는 아이폰이 연결돼 있지 않아서, 스크립트가 찍는
          # push_romfs.sh 복사 명령은 여기서 실행할 수 없다. 대신 RomFS.img를
          # 받아서 아이폰 파일 앱의 게임 폴더 > Documents/romfs/ 에 직접 복사한다.
          python scripts/build_ipa_from_nsp.py "$GAME_DIR" -k "$WORK/prod.keys" -o "$OUTPUT" --romfs separate
          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi
          echo "Slim IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Prepare RomFS artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          echo "=== Looking for RomFS.img ==="
          find "$GAME_DIR" -name "RomFS.img" -o -name "romfs.img" | head -20
          ROMFS_IMG="$(find "$GAME_DIR" -name "RomFS.img" -print -quit)"
          if [[ -z "$ROMFS_IMG" ]]; then
            ROMFS_IMG="$(find "$GAME_DIR" -name "romfs.img" -print -quit)"
          fi
          if [[ -n "$ROMFS_IMG" ]]; then
            echo "Found RomFS image: $ROMFS_IMG"
            cp "$ROMFS_IMG" "$RUNNER_TEMP/RomFS.img"
            ls -lh "$RUNNER_TEMP/RomFS.img"
            echo "RomFS.img ready. Copy this file to the phone's Documents/romfs/ folder after installing the slim IPA."
          else
            echo "=== No RomFS.img found. Listing build output for diagnosis ==="
            find "$GAME_DIR" -maxdepth 4 -type d | head -40
            find "$GAME_DIR" -maxdepth 4 -type f -name "*.img" | head -20
            echo "::error::--romfs separate ran, but no RomFS.img was found under GameFiles. Check the build log for the push_romfs.sh command the script printed."
            exit 1
          fi

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-Slim-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload RomFS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-RomFS
          path: ${{ runner.temp }}/RomFS.img
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/GameFiles"
